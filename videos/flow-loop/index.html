<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hemoperfusion Summit hero flow loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #eaf5fc;
      }
      #root,
      #scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <canvas id="stage" width="1920" height="1080"></canvas>
      </div>
    </div>
    <script>
      const TAU = Math.PI * 2;
      const W = 1920;
      const H = 1080;
      const ctx = document.getElementById("stage").getContext("2d");

      let seed = 16102026;
      function rnd() {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      }

      // Ribbon: a band between two travelling sine edges. Every speed is a whole
      // number of cycles per loop, so the last frame meets the first.
      const ribbons = [
        { y: 380, tilt: 0.1, amp: 120, k: 0.0021, ph: 0.6, sp: 1, w: 130, wk: 0.0027, wph: 1.0, wsp: -1, c: ["rgba(190,224,247,0)", "rgba(255,255,255,0.9)", "rgba(168,212,243,0.15)"] },
        { y: 620, tilt: -0.16, amp: 110, k: 0.0026, ph: 2.2, sp: -1, w: 96, wk: 0.0034, wph: 0.2, wsp: 1, c: ["rgba(64,146,222,0.5)", "rgba(196,230,250,0.85)", "rgba(40,118,204,0.42)"] },
        { y: 830, tilt: -0.2, amp: 96, k: 0.0029, ph: 4.1, sp: 1, w: 74, wk: 0.004, wph: 2.4, wsp: -1, c: ["rgba(24,104,199,0.72)", "rgba(132,196,243,0.8)", "rgba(15,76,160,0.6)"] },
        { y: 905, tilt: -0.21, amp: 90, k: 0.003, ph: 4.4, sp: 1, w: 15, wk: 0.005, wph: 0.8, wsp: 1, c: ["#b98a2e", "#fbe9b4", "#c79a3f"] },
        { y: 948, tilt: -0.2, amp: 84, k: 0.0031, ph: 4.9, sp: 1, w: 11, wk: 0.006, wph: 3.0, wsp: -1, c: ["#b3121c", "#ff5a5f", "#c2141f"] },
        { y: 1010, tilt: -0.12, amp: 70, k: 0.0024, ph: 1.3, sp: -1, w: 120, wk: 0.003, wph: 1.6, wsp: 1, c: ["rgba(255,255,255,0.85)", "rgba(226,242,252,0.9)", "rgba(255,255,255,0.7)"] },
      ];

      function ribbon(r, p) {
        const top = [];
        const bottom = [];
        for (let x = -80; x <= W + 80; x += 20) {
          const yc =
            r.y +
            r.tilt * (x - W / 2) +
            r.amp * Math.sin(r.k * x + r.ph + TAU * r.sp * p) +
            r.amp * 0.3 * Math.sin(r.k * 2.3 * x + r.ph * 1.7 - TAU * r.sp * p);
          const half = r.w * (0.55 + 0.45 * Math.sin(r.wk * x + r.wph + TAU * r.wsp * p));
          top.push([x, yc - half]);
          bottom.push([x, yc + half]);
        }
        const g = ctx.createLinearGradient(0, 0, W, 0);
        g.addColorStop(0, r.c[0]);
        g.addColorStop(0.5, r.c[1]);
        g.addColorStop(1, r.c[2]);
        ctx.fillStyle = g;
        ctx.beginPath();
        top.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])));
        bottom.reverse().forEach((q) => ctx.lineTo(q[0], q[1]));
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.7)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        top.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])));
        ctx.stroke();
      }

      const bokeh = [];
      for (let i = 0; i < 26; i++) {
        bokeh.push({ x: rnd() * W, y: rnd() * H, r: 22 + rnd() * 70, ph: rnd(), a: 0.1 + rnd() * 0.22, dx: 20 + rnd() * 40 });
      }
      const hexes = [];
      const HR = 62;
      [[1360, 150], [1467, 212], [1360, 274], [1574, 150], [300, 800], [407, 862], [1700, 640], [1807, 702], [1700, 764]].forEach((q, i) => {
        hexes.push({ x: q[0], y: q[1], ph: (i * 0.29) % 1 });
      });
      const sparks = [];
      for (let i = 0; i < 22; i++) {
        sparks.push({ x: rnd() * W, y: rnd() * H, s: 5 + rnd() * 11, ph: rnd(), n: 2 + (i % 2) });
      }

      function hex(h, p) {
        const t = 0.5 + 0.5 * Math.sin(TAU * (p + h.ph));
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = TAU * (i / 6) + TAU / 12;
          const x = h.x + HR * Math.cos(a);
          const y = h.y + HR * Math.sin(a) + 8 * Math.sin(TAU * (p + h.ph));
          if (i) ctx.lineTo(x, y);
          else ctx.moveTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = "rgba(255,255,255," + (0.16 + 0.26 * t).toFixed(3) + ")";
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255," + (0.5 + 0.4 * t).toFixed(3) + ")";
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      const state = { p: 0 };
      function draw() {
        const p = state.p;
        const sky = ctx.createLinearGradient(0, 0, W, H);
        sky.addColorStop(0, "#ffffff");
        sky.addColorStop(0.42, "#e6f3fc");
        sky.addColorStop(1, "#b9dcf5");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);
        const glow = ctx.createRadialGradient(1500, 430, 40, 1500, 430, 760 + 30 * Math.sin(TAU * p));
        glow.addColorStop(0, "rgba(255,255,255,0.95)");
        glow.addColorStop(0.45, "rgba(214,236,251,0.5)");
        glow.addColorStop(1, "rgba(214,236,251,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);
        ctx.filter = "blur(6px)";
        bokeh.forEach((o) => {
          ctx.globalAlpha = o.a * (0.55 + 0.45 * Math.sin(TAU * (p + o.ph)));
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(o.x + o.dx * Math.sin(TAU * (p + o.ph)), o.y + 14 * Math.cos(TAU * (p + o.ph)), o.r, 0, TAU);
          ctx.fill();
        });
        ctx.filter = "none";
        ctx.globalAlpha = 1;
        ribbons.slice(0, 2).forEach((r) => ribbon(r, p));
        hexes.forEach((h) => hex(h, p));
        ribbons.slice(2).forEach((r) => ribbon(r, p));
        sparks.forEach((s) => {
          const t = Math.max(0, Math.sin(TAU * (s.n * p + s.ph)));
          const gl = t * t;
          ctx.globalAlpha = gl;
          ctx.fillStyle = "#ffffff";
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.scale(0.5 + gl, 0.5 + gl);
          ctx.beginPath();
          ctx.moveTo(0, -s.s);
          ctx.quadraticCurveTo(s.s * 0.12, -s.s * 0.12, s.s, 0);
          ctx.quadraticCurveTo(s.s * 0.12, s.s * 0.12, 0, s.s);
          ctx.quadraticCurveTo(-s.s * 0.12, s.s * 0.12, -s.s, 0);
          ctx.quadraticCurveTo(-s.s * 0.12, -s.s * 0.12, 0, -s.s);
          ctx.fill();
          ctx.restore();
        });
        ctx.globalAlpha = 1;
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { p: 0 }, { p: 1, duration: 12, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
